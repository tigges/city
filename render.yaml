services:
  - type: web
    name: group-map
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: APP_TITLE
        value: Where is everyone?
      # Shared password for the whole site. Leave empty for no password.
      - key: SITE_PASSWORD
        sync: false
      # Starting setting for Industry ("true" = mandatory). Once fields are saved on /admin, those settings win.
      - key: INDUSTRY_REQUIRED
        value: "false"
      - key: ADMIN_KEY
        generateValue: true
      # Render's free plan has no persistent disk, so use a free Upstash Redis database
      # to keep entries across restarts. Paste the REST token from the Upstash console when prompted.
      - key: UPSTASH_REDIS_REST_URL
        value: https://rare-bluejay-240203.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
