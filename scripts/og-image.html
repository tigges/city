<!doctype html>
<!--
  Source for public/og-image.png (the WhatsApp/social link preview). Regenerate with:
  google-chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png scripts/og-image.html
  then compress it (e.g. pngquant) to well under 300 KB, or WhatsApp won't show it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #ec4899);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
      }
      .text { flex: 1; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px 10px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 26px;
        font-weight: 600;
      }
      .badge svg { width: 34px; height: 34px; fill: #fff; }
      h1 { margin: 28px 0 18px; font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; }
      p { margin: 0; font-size: 32px; line-height: 1.35; opacity: 0.9; }
      .map {
        position: relative;
        width: 500px;
        height: 460px;
        flex-shrink: 0;
        border-radius: 32px;
        background-color: #aad3df;
        background-image: radial-gradient(rgba(255, 255, 255, 0.55) 2.5px, transparent 2.5px);
        background-size: 22px 22px;
        box-shadow: 0 30px 60px rgba(17, 24, 39, 0.35);
        border: 8px solid rgba(255, 255, 255, 0.9);
        overflow: hidden;
      }
      .land { position: absolute; background: #f2efe9; border-radius: 46% 54% 42% 58% / 52% 40% 60% 48%; }
      .pin {
        position: absolute;
        display: grid;
        place-items: center;
        width: 66px;
        height: 66px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        border: 5px solid #fff;
        box-shadow: 0 8px 18px rgba(17, 24, 39, 0.3);
      }
      .pin span { transform: rotate(45deg); font-size: 24px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="text">
      <span class="badge">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
        Group map
      </span>
      <h1>Drop your pin.<br />See where everyone is.</h1>
      <p>Add your name and city. Takes 10 seconds.</p>
    </div>
    <div class="map">
      <div class="land" style="left: -40px; top: 40px; width: 230px; height: 210px"></div>
      <div class="land" style="left: 210px; top: -30px; width: 210px; height: 170px"></div>
      <div class="land" style="left: 250px; top: 170px; width: 190px; height: 250px"></div>
      <div class="land" style="left: 30px; top: 290px; width: 160px; height: 190px"></div>
      <div class="pin" style="left: 90px; top: 110px; background: #4f46e5"><span>CT</span></div>
      <div class="pin" style="left: 300px; top: 40px; background: #ec4899"><span>3</span></div>
      <div class="pin" style="left: 330px; top: 250px; background: #0ea5e9"><span>MA</span></div>
      <div class="pin" style="left: 80px; top: 330px; background: #f59e0b"><span>5</span></div>
      <div class="pin" style="left: 200px; top: 200px; background: #10b981"><span>JS</span></div>
    </div>
  </body>
</html>
